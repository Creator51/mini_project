# Project Configuration for Real-Time Cyber Threat Detection Framework

project:
  name: "Real-Time Cyber Threat Detection Framework Using Machine Learning"
  version: "1.0.0"
  random_state: 42

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  models_dir: "models"
  results_dir: "results"
  figures_dir: "results/figures"
  metrics_dir: "results/metrics"
  experiments_dir: "results/experiments"

dataset:
  primary: "Edge-IIoTset"
  primary_raw_file: "data/raw/Edge-IIoTset_dataset.csv"  # Default expected filename or directory
  target_binary_col: "Attack_label"
  target_multiclass_col: "Attack_type"

preprocessing:
  test_size: 0.2
  stratify: true

models:
  random_forest:
    n_estimators: 100
    max_depth: 20
    random_state: 42
    n_jobs: -1
  lightgbm:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 15
    random_state: 42
    n_jobs: -1
